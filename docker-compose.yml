# Local development stack: Postgres + app.
# Usage: cp .env.example .env  &&  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
      POSTGRES_DB: helpdesk
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://helpdesk:helpdesk@db:5432/helpdesk?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-dev-insecure-secret-change-me}
      SEED_DEMO: ${SEED_DEMO:-1}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@adcommtv.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports:
      - "3000:3000"

volumes:
  db_data:
